name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Check every dataset
        run: |
          pip install -r tools/requirements.txt
          python tools/check.py

      # git archive builds the same tarball from the same tag every time.
      - name: Build the tarball and checksums
        run: |
          git archive --format=tar.gz --prefix="datasets-${TAG}/" -o "datasets-${TAG}.tar.gz" "$TAG" datasets LICENSE README.md CITATION.cff
          sha256sum "datasets-${TAG}.tar.gz" > SHA256SUMS

      - name: Publish the release
        run: gh release create "$TAG" "datasets-${TAG}.tar.gz" SHA256SUMS --title "$TAG" --generate-notes
