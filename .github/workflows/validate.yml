name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install the checks
        run: pip install -r tools/requirements.txt

      - name: Test the checks
        run: pytest tools -q

      - name: Check every dataset
        if: github.event_name == 'push'
        run: python tools/check.py

      - name: Check every dataset, and that no released dataset was removed
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          python tools/check.py --base ../base/datasets

      # Written to the job summary, not a comment, so pull requests from
      # forks never need a token that can write.
      - name: Summarise the rows changed
        if: github.event_name == 'pull_request'
        run: python tools/diff_summary.py "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
